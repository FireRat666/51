<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Psychedelic Universe</title>
<meta name="description" content="Psychedelic Universe — An immersive visual experience with fractal mandalas, spiral galaxies, sacred geometry, digital rain, and endless customizable psychedelic effects.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23ff00de'/><circle cx='50' cy='50' r='25' fill='%2300ffde'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="grid-overlay"></div>

<canvas id="c"></canvas>
<audio id="audioPlayer" crossorigin="anonymous" preload="auto"></audio>
<input type="file" id="audioFileInput" accept="audio/*" style="display:none">

<div id="text-overlay">
  <div>
    <h1 class="glitch-text">Psychedelic Universe</h1>
    <p class="glitch-sub">Click anywhere to begin &bull; Gear icon for controls</p>
  </div>
</div>

<div class="webgl-wrap" id="webgl-wrap"></div>
<div class="css-wrap"></div>

<!-- On-Screen Audio Visualizer HUD Display -->
<div class="web-viz-container" id="web-viz-container">
  <canvas id="onScreenVizCanvas"></canvas>
</div>

<div id="fps"></div>

<button id="panel-toggle">&#9881;</button>

<aside id="controls-panel">
  <div class="panel-header">
    <h2>Psychedelic Controls</h2>
    <button class="close-btn">&times;</button>
  </div>
</aside>

<div id="warning-overlay">
  <div class="warning-box">
    <h2>Photosensitivity Warning</h2>
    <p>This page contains intense flashing colors, rapid motion, and visual effects that may trigger seizures or discomfort. Viewer discretion is strongly advised.</p>
    <button id="dismiss-warning">I Understand &bull; Enter</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/config.js"></script>
<script src="js/canvas-effects.js"></script>
<script src="js/particles.js"></script>
<script src="js/css-effects.js"></script>
<script src="js/glitch.js"></script>
<script src="js/audio.js"></script>
<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script>
let _fpsFrames = 0, _fpsTime = 0;
function updateFPS() {
  _fpsFrames++;
  const now = performance.now();
  if (now - _fpsTime > 1000) {
    document.getElementById('fps').textContent = _fpsFrames + ' FPS';
    _fpsFrames = 0; _fpsTime = now;
  }
  requestAnimationFrame(updateFPS);
}
requestAnimationFrame(updateFPS);

// WebGL / 3D Shader layer with automatic fallback
function initWebGL() {
  const wrap = document.getElementById('webgl-wrap');
  if (!wrap) return;
  
  if (window._webglActive) return;
  window._webglActive = true;

  // Check WebGL / Three.js
  if (typeof THREE !== 'undefined') {
    try {
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      wrap.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

      const uniforms = {
        u_time: { value: 0 },
        u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
        u_mouse: { value: new THREE.Vector2(0.5, 0.5) },
        u_intensity: { value: CFG.webglIntensity },
        u_speed: { value: CFG.webglSpeed },
        u_chaos: { value: CFG.chaos / 100 }
      };

      const vs = `void main(){gl_Position=vec4(position,1.0);}`;
      const fs = `
        precision highp float;
        uniform vec2 u_resolution; uniform float u_time; uniform vec2 u_mouse;
        uniform float u_intensity; uniform float u_speed; uniform float u_chaos;

        vec3 hsv2rgb(vec3 c) {
          vec4 K = vec4(1.,2./3.,1./3.,3.);
          vec3 p = abs(fract(c.xxx + K.xyz)*6. - K.www);
          return c.z * mix(K.xxx, clamp(p - K.xxx, 0., 1.), c.y);
        }

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
        }

        float noise(vec2 p) {
          vec2 i = floor(p), f = fract(p);
          f = f * f * (3. - 2. * f);
          return mix(mix(hash(i), hash(i + vec2(1.,0.)), f.x),
                     mix(hash(i + vec2(0.,1.)), hash(i + vec2(1.)), f.x), f.y);
        }

        void main() {
          vec2 uv = gl_FragCoord.xy / u_resolution.xy;
          vec2 p = (uv - 0.5) * vec2(u_resolution.x / u_resolution.y, 1.);
          float t = u_time * u_speed;
          vec2 m = (u_mouse - 0.5) * 2.;
          float c = u_chaos;

          vec2 q = p;
          for(int i = 0; i < 4; i++) {
            float f = float(i + 1) * (0.5 + c * 0.5);
            q += vec2(sin(q.y * f + t + m.x * f), cos(q.x * f + t + m.y * f)) * (0.2 + c * 0.15);
          }

          float angle = atan(q.y, q.x);
          float dist = length(q);
          float k = sin(angle * (6. + c * 4.) - t * 2.) * cos(dist * 15. - t * 3.);
          float n = noise(q * (3. + c * 3.) + t * 0.5);
          float md = distance(p, m * 0.5);
          float ripple = exp(-md * 4.) * sin(t * 5. - md * 15.);

          float hue = mod(dist * 0.3 + k * 0.2 + n * 0.15 + ripple * 0.1 + t * 0.03, 1.);
          float sat = 0.6 + k * 0.2 + n * 0.2;
          float lum = 0.5 + k * 0.2 + n * 0.2 + ripple * 0.1;

          float ab = 0.01 + c * 0.02;
          float r = hsv2rgb(vec3(fract(hue + ab), sat, lum)).r;
          float g = hsv2rgb(vec3(hue, sat, lum)).g;
          float b = hsv2rgb(vec3(fract(hue - ab), sat, lum)).b;
          vec3 col = vec3(r, g, b);

          float scan = sin(uv.y * u_resolution.y * 2.) * 0.03 + 1.;
          col *= scan;
          float vig = 1. - dist * 0.4;
          col *= vig;

          gl_FragColor = vec4(col * u_intensity, u_intensity * 0.7);
        }
      `;

      const mat = new THREE.ShaderMaterial({ uniforms, vertexShader: vs, fragmentShader: fs, transparent: true });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat);
      scene.add(mesh);

      document.addEventListener('mousemove', e => { uniforms.u_mouse.value.set(e.clientX / window.innerWidth, 1 - e.clientY / window.innerHeight); });
      window.addEventListener('resize', () => { renderer.setSize(window.innerWidth, window.innerHeight); uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight); });

      (function loop() {
        uniforms.u_time.value += 0.016;
        uniforms.u_intensity.value = CFG.webglIntensity;
        uniforms.u_speed.value = CFG.webglSpeed;
        uniforms.u_chaos.value = CFG.chaos / 100;
        wrap.style.display = CFG.toggles.webgl ? 'block' : 'none';
        renderer.render(scene, camera);
        requestAnimationFrame(loop);
      })();
      return;
    } catch (e) {
      console.warn('Three.js WebGL failed, initializing fallback shader layer:', e);
    }
  }

  // Fallback Canvas 2D 3D Shader Layer
  const canvas = document.createElement('canvas');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  canvas.style.cssText = 'width:100%;height:100%;pointer-events:none;';
  wrap.appendChild(canvas);
  const ctx = canvas.getContext('2d');

  let time = 0;
  window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });

  (function loop() {
    time += 0.02 * CFG.webglSpeed;
    wrap.style.display = CFG.toggles.webgl ? 'block' : 'none';
    if (CFG.toggles.webgl && CFG.webglIntensity > 0) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2, cy = canvas.height / 2;
      const radius = Math.min(cx, cy) * 0.9;
      const count = 12 * Math.max(1, CFG.webglComplexity || 4);
      ctx.save();
      ctx.globalAlpha = CFG.webglIntensity * 0.5;
      for (let i = 0; i < count; i++) {
        const angle = (i / count) * Math.PI * 2 + time;
        const r = (radius * 0.2) + Math.sin(time * 2 + i) * (radius * 0.4);
        const x = cx + Math.cos(angle) * r;
        const y = cy + Math.sin(angle) * r;
        const grad = ctx.createRadialGradient(x, y, 0, x, y, 80);
        const hue = (time * 50 + i * 30) % 360;
        grad.addColorStop(0, `hsla(${hue},100%,60%,0.4)`);
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(x, y, 80, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
    requestAnimationFrame(loop);
  })();
}

document.getElementById('dismiss-warning').addEventListener('click', () => {
  document.getElementById('warning-overlay').classList.add('hidden');
});

let started = false;
function startApp() {
  if (started) return;
  started = true;
  document.getElementById('text-overlay').dataset.dismissed = 'true';
  const sub = document.querySelector('.glitch-sub');
  if (sub) sub.style.display = 'none';
  Psy.init();
  CSSFX.init();
  GLITCH.init();
  UI.init();
  window._initWebGL = initWebGL;
  initWebGL();
}

document.addEventListener('click', startApp, { once: true });
// Auto start after warning dismiss
document.getElementById('dismiss-warning').addEventListener('click', startApp);
</script>
<div id="custom-tooltip" class="custom-tooltip"></div>
</body>
</html>
